# Render Blueprint — toàn bộ bản demo trong một file.
#
# Ba thành phần: một Postgres miễn phí, API chạy bằng Docker, và frontend là
# static site nằm trên CDN của Render.
#
# Dòng quan trọng nhất là `rewrite` ở cuối file. Cookie refresh đặt
# SameSite=Strict (xem backend/src/modules/auth/auth.tokens.ts), nghĩa là trình
# duyệt chỉ gửi nó khi API và trang gọi API thuộc cùng một site. Hai hostname
# *.onrender.com khác nhau là hai site khác nhau: đăng nhập vẫn được, nhưng F5
# một cái là mất phiên, và lỗi đó không hiện ra ở đâu cả. Để static site tự
# proxy /api sang backend thì trình duyệt chỉ nhìn thấy một domain duy nhất —
# cookie hoạt động, và tính chất chống CSRF của `strict` vẫn còn nguyên.

databases:
  - name: hrm-db
    databaseName: hrm
    user: hrm
    plan: free
    region: singapore

services:
  - type: web
    name: hrm-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    # Migrate, seed, rồi mới chạy server — xem backend/docker-start.sh để biết
    # vì sao cách này chỉ đúng với một bản demo một instance.
    #
    # Là một file script chứ không phải chuỗi `sh -c "..."` viết thẳng ở đây, vì
    # ô Docker Command của Render không qua shell: nó nhận nguyên cả câu lệnh làm
    # tên chương trình và báo "not found" mà không nói vì sao.
    dockerCommand: ./docker-start.sh

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      - key: DATABASE_URL
        fromDatabase:
          name: hrm-db
          property: connectionString

      # Render tự sinh, không ai phải nghĩ ra và không ai nhìn thấy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Điền trong dashboard sau lần deploy đầu, khi đã biết URL của static
      # site. Ví dụ: https://hrm-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # Provider tương thích OpenAI. Điền AI_BASE_URL, AI_MODEL và AI_API_KEY
      # trong dashboard — chúng là secret hoặc phụ thuộc nhà cung cấp bạn chọn.
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false

      # Bản demo công khai: siết hạn mức AI lại so với mặc định, vì mỗi câu hỏi
      # tiêu tốn quota của nhà cung cấp.
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 15
      - key: AI_TIMEOUT_MS
        value: 45000

      - key: COMPANY_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: LOG_LEVEL
        value: info

      # Bốn, không phải mười sáu: mỗi hash argon2id giữ 64 MB, và instance free
      # chỉ có 512 MB — vốn đã phải chia cho cả server đang chạy song song.
      - key: SEED_HASH_CONCURRENCY
        value: 4

  - type: web
    name: hrm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Đường dẫn tương đối, nên mọi request đi tới chính domain của static site
      # rồi được rewrite bên dưới chuyển tiếp sang API.
      - key: VITE_API_URL
        value: /api/v1

    # Thứ tự có ý nghĩa: rule chạy từ trên xuống, và rule đầu tiên khớp thì
    # dừng. Đảo hai cái này thì `/*` nuốt luôn mọi lời gọi API và trả về
    # index.html — frontend nhận HTML ở chỗ nó chờ JSON.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hrm-api.onrender.com/api/*

      # Router nằm ở phía client, nên URL không tương ứng với file nào trên
      # đĩa. Không có dòng này thì mở thẳng /employees, hay chỉ cần F5 trên đó,
      # là 404 — trang chủ vẫn chạy nên lỗi này rất dễ lọt.
      - type: rewrite
        source: /*
        destination: /index.html
