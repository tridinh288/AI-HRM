# Render Blueprint — toàn bộ bản demo trong một file.
#
# Hai thành phần: một Postgres miễn phí, và một web service Docker phục vụ cả
# API lẫn frontend.
#
# Một service chứ không phải hai, và đó là quyết định về bảo mật chứ không phải
# về chi phí. Cookie refresh đặt SameSite=Strict (xem
# backend/src/modules/auth/auth.tokens.ts), nên trình duyệt chỉ gửi nó khi
# trang web và API thuộc cùng một site. `onrender.com` nằm trong Public Suffix
# List, nghĩa là hai hostname con của nó là hai site khác nhau: tách frontend
# ra static site riêng thì đăng nhập vẫn được, rồi F5 một cái là mất phiên —
# và Safari chặn cookie kiểu đó ngay từ đầu. Cùng một origin thì câu hỏi đó
# không tồn tại, và tính chất chống CSRF của `strict` vẫn còn nguyên.
#
# Dockerfile ở thư mục gốc build cả hai nửa; app.ts phục vụ frontend từ
# ./public khi thấy nó ở đó.

databases:
  - name: hrm-db
    databaseName: hrm
    user: hrm
    plan: free
    region: singapore

services:
  - type: web
    name: ai-hrm
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    # Migrate, bật seed chạy nền, rồi khởi động server — xem
    # backend/docker-start.sh để biết vì sao seed không được chặn cổng.
    #
    # Là một file script chứ không phải chuỗi `sh -c "..."` viết thẳng ở đây, vì
    # ô Docker Command của Render không qua shell: nó nhận nguyên cả câu lệnh làm
    # tên chương trình và báo "not found" mà không nói vì sao.
    dockerCommand: ./docker-start.sh

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      - key: DATABASE_URL
        fromDatabase:
          name: hrm-db
          property: connectionString

      # Render tự sinh, không ai phải nghĩ ra và không ai nhìn thấy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Frontend gọi API bằng đường dẫn tương đối trên cùng origin, nên không
      # có request cross-origin nào để cho phép. Vẫn đặt đúng URL của chính
      # service này, để một client khác gọi tới thì hành vi vẫn rõ ràng.
      - key: CORS_ORIGIN
        sync: false

      # Provider tương thích OpenAI. Điền AI_BASE_URL, AI_MODEL và AI_API_KEY
      # trong dashboard — chúng là secret hoặc phụ thuộc nhà cung cấp bạn chọn.
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false

      # Bản demo công khai: siết hạn mức AI lại so với mặc định, vì mỗi câu hỏi
      # tiêu tốn quota của nhà cung cấp.
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 15
      - key: AI_TIMEOUT_MS
        value: 45000

      - key: COMPANY_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: LOG_LEVEL
        value: info

      # Bốn, không phải mười sáu: mỗi hash argon2id giữ 64 MB, và instance free
      # chỉ có 512 MB — vốn đã phải chia cho cả server đang chạy song song.
      - key: SEED_HASH_CONCURRENCY
        value: 4
